<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="The Black Hole: your bass drives four of the hole's quasinormal modes, each heard through its spin-weighted harmonic, h₊ on the left and h× on the right">
