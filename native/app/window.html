/* ---- shared/pedal.css */
/* pedal.css — every pedal page: the layout, the pedal's enclosure, knobs, footswitch, meters,
   the fretboard and the Controls panel. A pedal's style.css sets its enclosure's colours
   (--enclosure, --enclosure-ink, --accent). */

:root {
  --bg: #f4f1ec; --panel: #ffffff; --ink: #1d1b19; --ink-2: #6b655e; --line: #ddd6cc; --grid: #ebe5dc;
  --accent: #c2410c; --accent-2: #2563eb; --good: #15803d; --enclosure: #3f6f5a; --enclosure-ink: #f5f1e8; --led: #ff3b2f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --panel: #1b1b1d; --ink: #ece8e1; --ink-2: #a39d94; --line: #2e2e31; --grid: #262629;
    --accent: #fb923c; --accent-2: #60a5fa; --good: #4ade80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --panel: #1b1b1d; --ink: #ece8e1; --ink-2: #a39d94; --line: #2e2e31; --grid: #262629;
  --accent: #fb923c; --accent-2: #60a5fa; --good: #4ade80; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
#app { max-width: 1200px; margin: 0 auto; padding: 0 16px 24px; }
button, select, input { font: inherit; color: inherit; }
button, select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.ghost { background: transparent; }
button:disabled { opacity: 0.6; cursor: default; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 0; }
header.top .home { font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: 0.3px; }
header.top h1 { font-size: 20px; margin: 0 4px 0 0; }
header.top .spacer { flex: 1; }
.pill { font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.pill.warn { color: var(--accent); border-color: var(--accent); }
.status { font-size: 13px; color: var(--accent); }

.stage { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; align-items: start; }
@media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }

/* the enclosure */
.pedal {
  background: var(--enclosure); color: var(--enclosure-ink); border-radius: 18px; padding: 16px 18px 20px;
  box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.15), inset 0 -3px 0 rgb(0 0 0 / 0.25);
  display: flex; flex-direction: column; align-items: center; gap: 14px; position: relative;
}
.pedal .jacks { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.meter { display: grid; grid-template-columns: 28px 1fr 64px; align-items: center; gap: 8px; font-size: 12px; }
.meter .track { height: 6px; border-radius: 3px; background: rgb(0 0 0 / 0.3); overflow: hidden; }
.meter .bar { display: block; height: 100%; width: 0; background: #a7f3d0; transition: width 60ms linear; }
.meter.clip .bar { background: var(--led); }
.meter .mtxt { text-align: right; font-variant-numeric: tabular-nums; }
.knobs { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 18px; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 84px; text-align: center; }
.dial {
  --turn: 0deg; width: 62px; height: 62px; border-radius: 50%; position: relative; touch-action: none; cursor: grab;
  background: radial-gradient(circle at 40% 35%, #4a4a4a, #111 70%); box-shadow: 0 3px 6px rgb(0 0 0 / 0.45);
}
.dial:focus-visible { outline: 3px solid var(--enclosure-ink); outline-offset: 3px; }
.dial .mark { position: absolute; left: 50%; top: 50%; width: 3px; height: 26px; margin-left: -1.5px; background: #f5f1e8;
  transform-origin: 50% 0; transform: rotate(calc(var(--turn) + 180deg)); border-radius: 2px; }
.klabel { font-size: 12px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; }
.kval { font-size: 12px; opacity: 0.85; font-variant-numeric: tabular-nums; }
.pedal .name { text-align: center; }
.pedal .name span { display: block; font: 800 26px/1 Georgia, "Times New Roman", serif; letter-spacing: 1px; }
.pedal .name small { opacity: 0.8; font-size: 12px; }
.switchrow { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.led { width: 12px; height: 12px; border-radius: 50%; background: #5a1a16; box-shadow: inset 0 1px 2px rgb(0 0 0 / 0.5); }
.led.on { background: var(--led); box-shadow: 0 0 10px var(--led); }
.footswitch { width: 64px; height: 64px; border-radius: 50%; border: none;
  background: radial-gradient(circle at 40% 35%, #f1f1f1, #9a9a9a 70%); box-shadow: 0 4px 0 #555, 0 6px 10px rgb(0 0 0 / 0.4); }
.footswitch:active { transform: translateY(3px); box-shadow: 0 1px 0 #555, 0 2px 6px rgb(0 0 0 / 0.4); }

/* the tuner: 1 % of the scale's width is one cent, the green zone ±3 cents */
.tunercard figcaption { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.tunercard figcaption span { display: inline-flex; align-items: center; gap: 5px; }
.tunercard figcaption input { width: 62px; padding: 2px 5px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; }
.tunercard .mute { margin-left: auto; font-size: 13px; padding: 4px 10px; }
.tunercard .mute[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.t-body { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "name scale" "name read"; gap: 2px 14px; align-items: center; padding: 4px 2px 2px; }
.t-name { grid-area: name; min-width: 2.2em; text-align: center; font: 700 50px/1 Georgia, "Times New Roman", serif; }
.t-name sub { font: 600 18px/1 system-ui, sans-serif; vertical-align: baseline; margin-left: 1px; }
.t-scale { grid-area: scale; position: relative; height: 34px; margin: 0 14px 18px; border-bottom: 2px solid var(--line); }
.t-zone { position: absolute; left: 47%; width: 6%; top: 0; bottom: 0; border-radius: 4px 4px 0 0; background: color-mix(in srgb, var(--good) 25%, transparent); }
.t-tick { position: absolute; bottom: 0; width: 2px; height: 10px; margin-left: -1px; background: var(--ink-2); }
.t-tick i { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font: 11px/1 system-ui, sans-serif; font-style: normal; color: var(--ink-2); white-space: nowrap; }
.t-needle { position: absolute; bottom: 0; left: 50%; width: 4px; height: 32px; margin-left: -2px; border-radius: 2px; background: var(--accent); transition: left 90ms linear; }
.t-read { grid-area: read; display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 0 14px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.t-cents { color: var(--ink); font-weight: 600; min-width: 5.5ch; }
.tunercard.intune .t-name, .tunercard.intune .t-cents { color: var(--good); }
.tunercard.intune .t-needle { background: var(--good); }
.tunercard.idle .t-needle { opacity: 0; }
.tunercard.stale .t-name, .tunercard.stale .t-needle, .tunercard.stale .t-cents { opacity: 0.45; }
@media (max-width: 420px) { .t-name { font-size: 40px; } .t-scale, .t-read { margin-left: 4px; margin-right: 8px; } }

/* views */
.views { display: grid; gap: 16px; }
.card { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.card figcaption { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.card figcaption b { color: var(--ink); }
.card .canvas { height: 230px; }
.card canvas { width: 100%; height: 100%; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 16px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }

/* the test bass */
.fretboard { margin-top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.fret-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.fret-head b { color: var(--ink); }
.fret-head button { margin-left: auto; }
.frets { display: grid; gap: 4px; }
.string { display: grid; grid-template-columns: 18px repeat(10, 1fr); gap: 4px; align-items: center; }
.sname { font-size: 12px; font-weight: 700; color: var(--ink-2); text-align: center; }
.string button { height: 30px; padding: 0; border-radius: 6px; touch-action: none; position: relative; }
.string button::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 2px; background: var(--ink-2); opacity: 0.5; }
.string button.open { background: var(--grid); }
.string button:active { background: var(--accent); }

/* controls */
.controls { margin-top: 16px; }
.controls-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
.controls-bar .inline { font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.controls-bar input[type="number"] { width: 70px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.group { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin: 0; padding: 8px 12px 10px; min-width: 0; }
.group legend { font-weight: 700; padding: 0 4px; }
.row { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "label info" "input value" "hint hint"; gap: 2px 8px; padding: 6px 0; border-top: 1px solid var(--grid); }
.row:first-of-type { border-top: none; }
.row[hidden] { display: none; }
.row label { grid-area: label; font-size: 13px; }
.row .info { grid-area: info; padding: 0 6px; border: none; background: none; color: var(--ink-2); }
.row input[type="range"], .row select { grid-area: input; width: 100%; min-width: 0; accent-color: var(--accent); }
.row input[type="checkbox"] { grid-area: input; justify-self: start; width: 18px; height: 18px; accent-color: var(--accent); }
.row output { grid-area: value; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
.row .hint { grid-area: hint; margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }

footer { margin-top: 24px; font-size: 13px; color: var(--ink-2); }
footer a { color: inherit; }

/* How it works */
dialog.notes { width: min(820px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); }
dialog.notes::backdrop { background: rgb(0 0 0 / 0.45); }
.notes-bar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
.notes-body { padding: 4px 18px 18px; overflow-wrap: anywhere; }
.notes-body table { border-collapse: collapse; display: block; overflow-x: auto; }
.notes-body td, .notes-body th { border: 1px solid var(--line); padding: 4px 8px; }
.notes-body pre { overflow-x: auto; background: var(--grid); padding: 8px; border-radius: 8px; }

/* ---- buffer/style.css */
/* the Buffer's enclosure: a plain grey box, as a buffer is */
:root[data-pedal="buffer"] { --enclosure: #5b6470; --enclosure-ink: #f5f3ef; }

/* the Phuzz's enclosure: a round-cornered box in a deep red, as the germanium fuzzes of the
   sixties often were */
:root[data-pedal="phuzz"] { --enclosure: #8c2f1f; --enclosure-ink: #f7efe6; }
/* the transistors' view: two plots side by side, stacked on a phone */
.card .canvas.transistors { height: 260px; }
@media (max-width: 560px) { .card .canvas.transistors { height: 440px; } }

/* app.css — the app window's own styles, after the site's shared/pedal.css. */

.audio-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.audio-row .inline { font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.audio-row select { max-width: 260px; }
.audio-row input[type="number"] { width: 70px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
header.top .home { cursor: default; }
/* the pedal's name is the menu that picks it */
header.top h1 .pedal-pick { font: inherit; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 0 4px; margin: 0 -4px; cursor: pointer; }
header.top h1 .pedal-pick:hover, header.top h1 .pedal-pick:focus-visible { border-color: var(--line); }

  <script>
'use strict';
// ---- shared/params.js
const __m1 = (() => {

// params.js — a pedal's parameters as its descriptor lists them, and the text a value shows. The
// C++ (native/core/src/params.cpp) shows the same text from the same fields, so a knob reads alike
// on the page and in a plugin.
//
//   { id: 'pickupL', label: 'Pickup inductance', min: 0.5, max: 12, def: 3.6, log: true,
//     unit: 'H', scale: 1, decimals: 2, hint: 'What the hint says the knob does to the sound.' }
//   { id: 'active', label: 'Active electronics', type: 'checkbox', def: false }
//   { id: 'mode', label: 'Mode', type: 'select', options: [['a', 'A'], ['b', 'B']], def: 'a' }
//
// Values are in SI units (ohms, farads, henries, metres, seconds); `scale` shows them in friendlier
// ones (kΩ: scale 0.001). `showIf: (P) => …` hides a control when it is irrelevant (page only).

const params = (groups) => groups.flatMap((g) => g.params.map((p) => ({ group: g.name, ...p })));

function defaults(groups) {
  const P = {};
  for (const p of params(groups)) P[p.id] = p.def;
  return P;
}

function fmt(p, v) {
  if (p.type === 'select') return p.options.find(([x]) => x === v)?.[1] ?? String(v);
  if (p.type === 'checkbox') return v ? 'on' : 'off';
  let s = (v * (p.scale ?? 1)).toFixed(p.decimals ?? 2);
  if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
  s = s.replace('-', '−');
  return p.unit ? `${s} ${p.unit}` : s;
}

// A parameter's number for the native code: a choice's index, a toggle's 0 or 1.
function nativeValue(p, v) {
  if (p.type === 'select') { const k = p.options.findIndex(([x]) => x === v); return k < 0 ? p.options.findIndex(([x]) => x === p.def) : k; }
  if (p.type === 'checkbox') return v ? 1 : 0;
  return typeof v === 'number' && Number.isFinite(v) ? v : p.def;
}

// Position 0..1 along a knob (log parameters in log(value)), and back, snapped to `step`.
function toUnit(p, v) {
  if (p.log) return Math.log(v / p.min) / Math.log(p.max / p.min);
  return (v - p.min) / (p.max - p.min);
}
function fromUnit(p, x) {
  x = Math.min(1, Math.max(0, x));
  let v = p.log ? p.min * (p.max / p.min) ** x : p.min + x * (p.max - p.min);
  if (p.step) v = p.min + Math.round((v - p.min) / p.step) * p.step;
  return Math.min(p.max, Math.max(p.min, v));
}

return { params, defaults, fmt, nativeValue, toUnit, fromUnit };
})();

// ---- shared/tuner.js
const __m2 = (() => {

// tuner.js — the pitch of the input, for the page's tuner. Two steps:
//
// 1. detectPitch: the period, by normalised autocorrelation with parabolic interpolation over a
//    bass's range (30–500 Hz; the method the tests use, tools/audio-util.mjs). It finds the
//    period of the whole waveform, so it is right about the note even when the fundamental is weak.
// 2. refine: the fundamental's own frequency, the peak of a Hann-windowed Fourier transform near
//    that estimate. A real string is stiff: its partials run sharp, f_n = n f₁ √(1 + Bn²), and
//    the waveform's period is a compromise among them, a few cents sharp of f₁ on a low E. A
//    tuner should read f₁, the pitch the string is tuned by, so the peak search reads it directly.
//
// tune() puts them together, on the part of the block since the note began; Tuner smooths its readings for a steady needle.

const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
// the open strings of four-, five- and six-string basses: B0 E1 A1 D2 G2 C3
const OPEN_STRINGS = [23, 28, 33, 38, 43, 48];

function detectPitch(x, fs, fmin = 30, fmax = 500) {
  const lo = Math.floor(fs / fmax), hi = Math.ceil(fs / fmin), n = x.length - hi - 1;
  if (n < hi) return 0;
  let e = 0;
  for (let i = 0; i < n; i++) e += x[i] * x[i];
  if (e / n < 1e-7) return 0; // too quiet to trust
  const r = new Float32Array(hi + 2);
  let top = 0;
  for (let lag = lo; lag <= hi + 1; lag++) {
    let s = 0, e1 = 0;
    for (let i = 0; i < n; i++) { s += x[i] * x[i + lag]; e1 += x[i + lag] * x[i + lag]; }
    r[lag] = s / Math.sqrt(e * e1 + 1e-30);
    if (lag <= hi && r[lag] > top) top = r[lag];
  }
  if (top < 0.6) return 0;
  for (let lag = lo + 1; lag <= hi; lag++) {
    if (r[lag] > 0.9 * top && r[lag] >= r[lag - 1] && r[lag] >= r[lag + 1]) {
      const a = r[lag - 1], b = r[lag], c = r[lag + 1], d = (a - c) / (2 * (a - 2 * b + c));
      return fs / (lag + d);
    }
  }
  return 0;
}

const hann = new Map();
function window(N) {
  if (!hann.has(N)) { const w = new Float64Array(N); for (let i = 0; i < N; i++) w[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (N - 1)); hann.set(N, w); }
  return hann.get(N);
}
// |X(f)|² of the Hann-windowed block, by a rotating phasor
function power(x, w, f, fs) {
  const c = Math.cos((2 * Math.PI * f) / fs), s = Math.sin((2 * Math.PI * f) / fs);
  let pr = 1, pi = 0, re = 0, im = 0;
  for (let i = 0; i < x.length; i++) {
    const y = x[i] * w[i];
    re += y * pr; im -= y * pi;
    const t = pr * c - pi * s; pi = pr * s + pi * c; pr = t;
  }
  return re * re + im * im;
}
// The strongest frequency within ±span of f: a grid, two finer grids, then a parabola through
// the log powers (exact for a Gaussian peak, and within a hundredth of a cent for Hann's).
function refine(x, fs, f, span = 0.03) {
  const w = window(x.length);
  let c = f, step = (f * span) / 10;
  for (let pass = 0; pass < 3; pass++) {
    let best = c, bp = -1;
    for (let k = -10; k <= 10; k++) { const g = c + k * step, p = power(x, w, g, fs); if (p > bp) { bp = p; best = g; } }
    c = best;
    if (pass < 2) step /= 8;
  }
  const a = Math.log(power(x, w, c - step, fs) + 1e-300), b = Math.log(power(x, w, c, fs) + 1e-300), d = Math.log(power(x, w, c + step, fs) + 1e-300);
  const den = a - 2 * b + d;
  return den < 0 ? c + (step * (a - d)) / (2 * den) : c;
}

// The fundamental of a block: the period for the note, then the fundamental's own peak. The
// period needs only to land within the peak search's ±3 %, so it is found on the newest `coarse`
// samples averaged down to about 12 kHz (a bass's fundamentals are below 500 Hz), sixteen times
// less work than at full rate; the peak search uses every sample.
function tune(x, fs, { coarse = 8192 } = {}) {
  const D = Math.max(1, Math.floor(fs / 12000)), src = x.length > coarse ? x.subarray(x.length - coarse) : x;
  const y = new Float32Array(Math.floor(src.length / D));
  for (let i = 0; i < y.length; i++) { let s = 0; for (let j = 0; j < D; j++) s += src[i * D + j]; y[i] = s / D; }
  const f = detectPitch(y, fs / D), part = f ? sounding(x, fs) : null;
  return part ? refine(part, fs, f) : 0;
}
// The part of a block since the note began: a block that starts in the silence before a pluck
// puts a step in the window, and the step's spectrum pulls the peak by tens of cents. The part
// kept starts 5 ms after the first sample above a tenth of the block's peak (past the pick's
// scrape); when that leaves under half the block, the note is too new to read, and it waits.
function sounding(x, fs) {
  let top = 0;
  for (let i = 0; i < x.length; i++) top = Math.max(top, Math.abs(x[i]));
  let i0 = 0;
  while (i0 < x.length && Math.abs(x[i0]) < 0.1 * top) i0++;
  if (i0 === 0) return x;
  const start = i0 + Math.round(0.005 * fs);
  return x.length - start >= x.length / 2 ? x.subarray(start) : null;
}

function noteOf(f, a4 = 440) {
  const m = 69 + 12 * Math.log2(f / a4), k = Math.round(m);
  return { name: `${NAMES[((k % 12) + 12) % 12]}${Math.floor(k / 12) - 1}`, letter: NAMES[((k % 12) + 12) % 12], octave: Math.floor(k / 12) - 1, cents: 100 * (m - k), key: k, target: a4 * 2 ** ((k - 69) / 12) };
}

// Readings smoothed for the needle: the median of the last three (a stray octave or a pluck's
// first scrape is outvoted), then an exponential average of the cents while the note holds.

  const a4Input = h('input', { type: 'number', min: 415, max: 466, step: 0.5, value: tuning.a4, 'aria-label': 'Reference pitch, A4 in hertz' });
  a4Input.addEventListener('change', () => { tuning.a4 = Math.min(466, Math.max(415, +a4Input.value || 440)); a4Input.value = tuning.a4; ui.a4 = tuning.a4; call('store', 'ui', ui); });
  const scale = h('div', { class: 't-scale', 'aria-hidden': 'true' }, h('span', { class: 't-zone' }),
    ...[-50, -25, 0, 25, 50].map((c) => { const t = h('span', { class: 't-tick' }, h('i', {}, c > 0 ? `+${c}` : c < 0 ? `−${-c}` : '0')); t.style.left = `${50 + c}%`; return t; }), tNeedle);
  const tunerCard = h('figure', { class: 'card tunercard idle', 'aria-label': 'Tuner' },
    h('figcaption', {}, h('b', {}, 'Tuner'), h('span', {}, 'the fundamental, in cents from A4 =', a4Input, 'Hz'), muteBtn),
    h('div', { class: 't-body' }, h('div', { class: 't-name', role: 'status' }, tNote, tOct), scale, h('div', { class: 't-read' }, tCents, tHz, tString)));

  // ---- Controls
  const presetSel = h('select', { 'aria-label': 'Presets', onchange: () => { if (presetSel.value) applyPreset(presetSel.value); presetSel.value = ''; } },
    h('option', { value: '' }, 'Presets…'), ...Object.keys(PEDAL.presets ?? {}).map((n) => h('option', { value: n }, n)), h('option', { value: '__defaults' }, 'Default settings'));
  const rows = [];
  const groupsEl = h('div', { class: 'groups' });
  for (const g of PEDAL.groups) {
    const box = h('fieldset', { class: 'group' }, h('legend', {}, g.name));
    for (const p of g.params) {
      const val = h('output', {});
      let input;
      if (p.type === 'checkbox') { input = h('input', { type: 'checkbox', id: `p-${p.id}` }); input.addEventListener('change', () => set(p.id, input.checked)); }
      else if (p.type === 'select') { input = h('select', { id: `p-${p.id}` }, ...p.options.map(([v, l]) => h('option', { value: v }, l))); input.addEventListener('change', () => set(p.id, input.value)); }
      else { input = h('input', { type: 'range', min: 0, max: 1000, step: 1, id: `p-${p.id}` }); input.addEventListener('input', () => set(p.id, fromUnit(p, input.value / 1000))); }
      const hint = h('p', { class: 'hint', hidden: true }, p.hint ?? '');
      const infoBtn = p.hint ? h('button', { type: 'button', class: 'info', 'aria-label': `About ${p.label}`, onclick: () => hint.toggleAttribute('hidden') }, 'ⓘ') : null;
      const row = h('div', { class: 'row' }, h('label', { for: `p-${p.id}` }, p.label), infoBtn, input, val, hint);
      rows.push({ p, row, input, val });
      box.append(row);
    }
    groupsEl.append(box);
  }
  const controls = h('section', { class: 'controls' }, h('div', { class: 'controls-bar' }, h('b', {}, 'Controls'), presetSel), groupsEl);

  app.append(audioCard, h('div', { class: 'stage' }, face, h('section', { class: 'views' }, tunerCard)), controls,
    h('footer', {}, `${PEDAL.name} ${info.version} · Phuzzbox · physics, not samples. Space is the footswitch.`));
  for (const p of all.filter((q) => q.perform && q.type !== 'checkbox' && q.type !== 'select')) knobs.append(knob(p));

  // ---- state
  function refresh() {
    for (const { p, row, input, val } of rows) {
      if (p.type === 'checkbox') input.checked = !!P[p.id];
      else if (p.type === 'select') input.value = P[p.id];
      else input.value = Math.round(1000 * toUnit(p, P[p.id]));
      val.textContent = p.type === 'checkbox' ? '' : fmt(p, P[p.id]);
      row.hidden = p.showIf ? !p.showIf(P) : false;
    }
    for (const k of knobs.children) k.refresh?.();
  }
  function send(p) { call('set', p.id, nativeValue(p, P[p.id])); }
  let saveTimer = null;
  const saveParams = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => call('store', 'params', P), 300); };
  function set(id, v) {
    P[id] = v;
    send(all.find((p) => p.id === id));
    saveParams();
    refresh();
  }
  function applyPreset(name) {
    const keep = Object.fromEntries((PEDAL.keep ?? []).map((id) => [id, P[id]]));
    if (name === '__defaults') Object.assign(P, defaults(PEDAL.groups), keep);
    else Object.assign(P, PEDAL.presets[name]);
    for (const p of all) send(p);
    saveParams();
    refresh();
  }
  function setBypass(on) {
    audio.bypass = on ? 1 : 0;
    call('bypass', audio.bypass);
    call('store', 'audio', audio);
    led.classList.toggle('on', !on);
    foot.setAttribute('aria-pressed', String(!on));
  }
  let muted = false;
  function setMute(on) {
    muted = on;
    call('mute', on);
    muteBtn.setAttribute('aria-pressed', String(on));
    muteBtn.textContent = on ? 'Muted: unmute' : 'Mute';
  }
  function knob(p) {
    const dial = h('div', { class: 'dial', role: 'slider', tabindex: 0, 'aria-label': p.label, title: p.hint ?? '' }, h('span', { class: 'mark' }));
    const val = h('div', { class: 'kval' });
    const el = h('div', { class: 'knob' }, dial, h('div', { class: 'klabel' }, p.label.replace(/\s*\(.*\)$/, '')), val);
    el.refresh = () => {
      const u = toUnit(p, P[p.id]);
      dial.style.setProperty('--turn', `${-135 + 270 * u}deg`);
      dial.setAttribute('aria-valuetext', fmt(p, P[p.id]));
      val.textContent = fmt(p, P[p.id]);
    };
    let start = null;
    dial.addEventListener('pointerdown', (e) => { dial.setPointerCapture(e.pointerId); start = { x: e.clientX, y: e.clientY, u: toUnit(p, P[p.id]) }; });
    dial.addEventListener('pointermove', (e) => { if (start) set(p.id, fromUnit(p, start.u + ((e.clientX - start.x) - (e.clientY - start.y)) / (e.shiftKey ? 800 : 200))); });
    dial.addEventListener('pointerup', () => { start = null; });
    dial.addEventListener('dblclick', () => set(p.id, p.def));
    dial.addEventListener('keydown', (e) => {
      const step = { ArrowUp: 0.02, ArrowRight: 0.02, ArrowDown: -0.02, ArrowLeft: -0.02 }[e.key];
      if (step) { e.preventDefault(); set(p.id, fromUnit(p, toUnit(p, P[p.id]) + step * (e.shiftKey ? 0.25 : 1))); }
    });
    return el;
  }
  function meter(label) {
    const bar = h('span', { class: 'bar' }), txt = h('span', { class: 'mtxt' }, '–');
    const el = h('div', { class: 'meter' }, h('span', { class: 'mlabel' }, label), h('span', { class: 'track' }, bar), txt);
    return {
      el,
      set(volts, clip) {
        const dbv = volts > 0 ? 20 * Math.log10(volts) : -Infinity;
        bar.style.width = `${Math.max(0, Math.min(100, ((dbv + 48) / 54) * 100))}%`;
        txt.textContent = Number.isFinite(dbv) ? `${(1000 * volts).toFixed(0)} mV` : '–';
        el.classList.toggle('clip', !!clip);
      },
    };
  }
  onSpace = () => setBypass(!audio.bypass);

  // ---- the levels, the tuner and the measurement, ten times a second
  let t = 0, wasMeasuring = false;
  async function tick() {
    if (me !== drawn) return; // a newer window has its own
    const r = await call('poll');
    if (me !== drawn) return;
    t += 0.1;
    meterIn.set(r.in, r.in / audio.fullScale > 0.98);
    meterOut.set(r.out, r.out / audio.fullScale > 0.98);
    cpu.textContent = `CPU ${(100 * r.cpu).toFixed(1)}%`;
    if (r.measured === -1) wasMeasuring = true;
    else if (wasMeasuring) {
      wasMeasuring = false;
      measureBtn.disabled = false;
      if (r.measured === -2) status.textContent = 'Nothing came back: is a cable connected from the output to this input?';
      else { status.textContent = ''; measured.hidden = false; measured.textContent = `round trip ${r.measured.toFixed(1)} ms (measured)`; }
    }
    const n = tuning.push(r.f, t);
    tunerCard.classList.toggle('idle', !n);
    tunerCard.classList.toggle('stale', !!n && !n.live);
    tunerCard.classList.toggle('intune', !!n && Math.abs(n.cents) < 3);
    if (!n) { tNote.textContent = '–'; tOct.textContent = ''; tCents.textContent = ''; tHz.textContent = 'Play a note'; tString.textContent = ''; }
    else {
      tNote.textContent = n.letter; tOct.textContent = n.octave;
      tCents.textContent = `${n.cents >= 0.05 ? '+' : n.cents <= -0.05 ? '−' : '±'}${Math.abs(n.cents).toFixed(1)}¢`;
      tHz.textContent = `${n.f.toFixed(2)} Hz, in tune at ${n.target.toFixed(2)}`;
      tString.textContent = OPEN_STRINGS.includes(n.key) ? `open ${n.letter} string` : '';
      tNeedle.style.left = `${50 + Math.max(-50, Math.min(50, n.cents))}%`;
    }
    setTimeout(tick, 100);
  }

  // the program already holds the saved parameters; send them all once so both agree
  for (const p of all) send(p);
  if (Object.keys(carry).length) saveParams();
  setBypass(!!audio.bypass);
  setFullScale();
  refresh();
  showStream();
  tick();
}

let onSpace = () => {};
addEventListener('keydown', (e) => {
  if (e.code !== 'Space' || e.repeat || e.target.closest?.('input, select, textarea, button, [role=slider]')) return;
  e.preventDefault();
  onSpace();
});

call('describe').then(main).catch((err) => { document.getElementById('app').textContent = `The window failed to start: ${err.message}`; });

return {  };
})();

  </script>
</body>
</html>
