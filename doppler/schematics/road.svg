<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="The Doppler: the source on a straight road d from you, what you hear now sent from where it was D earlier, along a path c D long">
<title>The Doppler: the source on a straight road d from you, what you hear now sent from where it was D earlier, along a path c D long</title>
<rect width="640" height="300" rx="10" fill="#151518" stroke="#2b2a30"/>
<rect x="12" y="52" width="616" height="32" rx="6" fill="none" stroke="#9b958b" stroke-width="1.6" stroke-dasharray="6 6"/>
<text x="52" y="38" text-anchor="start" fill="#9b958b" font-size="11" font-weight="400">the road</text>
<circle cx="160" cy="68" r="3" fill="#ece8e1"/>
<text x="152" y="108" text-anchor="end" fill="#9b958b" font-size="11" font-weight="400">where it was: τ = t − D</text>
<rect x="410" y="58" width="20" height="20" rx="6" fill="none" stroke="#fb923c" stroke-width="1.6"/>
<path d="M436 68 L500 68" fill="none" stroke="#fb923c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M492.8 71.48 L500 68 L492.8 64.52" fill="none" stroke="#fb923c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="468" y="38" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="600">v</text>
<text x="420" y="108" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="400">where it is now</text>
<path d="M160 68 L314 230" fill="none" stroke="#9b958b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/>
<path d="M306.51 227.18 L314 230 L311.56 222.38" fill="none" stroke="#9b958b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="208" y="188" text-anchor="end" fill="#9b958b" font-size="11" font-weight="400">the sound: c D</text>
<circle cx="320" cy="240" r="3" fill="#ece8e1"/>
<circle cx="308" cy="240" r="3" fill="#ece8e1"/>
<circle cx="332" cy="240" r="3" fill="#ece8e1"/>
<text x="320" y="276" text-anchor="middle" fill="#ece8e1" font-size="12" font-weight="600">you, at t (moving at u)</text>
<path d="M540 68 L540 240" fill="none" stroke="#ece8e1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="552" y="160" text-anchor="start" fill="#9b958b" font-size="12" font-weight="600">d</text>
<text x="320" y="292" text-anchor="middle" fill="#9b958b" font-size="11" font-weight="400">c² D² = (X − v D)² + d²: X where it is now, from you along the road</text>
</svg>
