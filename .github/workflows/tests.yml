name: tests
on:
  pull_request:
  push:
    branches: [main, live]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release-note check compares the pull request with its base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Into main: no version changes but a release's, and a note in changes/ when the site or the
      # plugins change. Into live: the release has been made (no notes left). changes/README.md.
      - name: Versions and release notes
        if: github.event_name == 'pull_request'
        run: node tools/release.mjs --check-pr "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
      - run: CI=1 npm test
