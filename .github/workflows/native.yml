name: native
on:
  pull_request:
  push:
    branches: [main, live]
jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
      - name: Build the WebAssembly and check the committed files are current
        run: |
          cd native && cmake --preset wasm && cmake --build --preset wasm && ctest --preset wasm
          cd .. && git diff --exit-code -- '*.wasm'
      # what it built, so a change made where Emscripten isn't installed can take CI's build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm
          path: '*/wasm/*.wasm'
          retention-days: 7
  plugins:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022] # pinned as Forte's: the windows preset's generator is Visual Studio 2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libx11-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - if: runner.os == 'macOS'
        run: brew install ninja
      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: cd native && cmake --preset linux && cmake --build --preset linux && ctest --preset linux
      - name: Build and test (macOS)
        if: runner.os == 'macOS'
        run: cd native && cmake --preset macos && cmake --build --preset macos && ctest --preset macos
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: cd native && cmake --preset windows && cmake --build --preset windows && ctest --preset windows
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.os }}
          path: native/build/*/plugins/
          retention-days: 14
      # What a plugin release ships (the release-plugins workflow publishes live's): the archives
      # tools/package-plugins.sh packs, on every run so a pull request checks they pack. On a Mac,
      # every bundle gets an ad-hoc signature first, without which Apple silicon won't load it.
      - name: Sign the bundles (macOS)
        if: runner.os == 'macOS'
        run: find native/build/macos/plugins \( -name '*.component' -o -name '*.vst3' -o -name '*.clap' -o -name '*.app' \) -prune -exec codesign --force --deep --sign - {} \;
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package the release's archives
        shell: bash
        run: |
          preset=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          tools/package-plugins.sh "$preset"
          echo "PRESET=$preset" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.PRESET }}
          path: dist/
          retention-days: 30
      # the app, zipped by the system's own tool so the Mac bundle keeps its permissions and signature
      - name: Package the app (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent native/build/macos/app/PhuzzBox.app PhuzzBox-macos.zip
      - name: Package the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path native/build/windows/app/Release/PhuzzBox.exe -DestinationPath PhuzzBox-windows.zip
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: PhuzzBox-app-${{ matrix.os }}
          path: PhuzzBox-*.zip
          retention-days: 30
