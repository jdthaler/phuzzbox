<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="The interferometer: a beam split into two arms, one mirror moved by the bass">
