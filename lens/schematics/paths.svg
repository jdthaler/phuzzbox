<circle cx="40" cy="136" r="3" fill="#ece8e1"/>
<text x="40" y="112" text-anchor="middle" fill="#9b958b" font-size="12" font-weight="400">source ✦</text>
<circle cx="340" cy="160" r="3" fill="#ece8e1"/>
<text x="340" y="186" text-anchor="middle" fill="#9b958b" font-size="12" font-weight="400">lens: M</text>
<circle cx="640" cy="160" r="3" fill="#ece8e1"/>
<text x="640" y="192" text-anchor="middle" fill="#9b958b" font-size="12" font-weight="400">you</text>
<text x="340" y="32" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="400">the first image: past the near side, brightened μ₊</text>
<text x="340" y="264" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="400">the second: past the far side, Δt later, μ₋, turned a quarter cycle</text>
<text x="340" y="288" text-anchor="middle" fill="#9b958b" font-size="11" font-weight="400">waves take every path in between, and the longest go round the lens untouched</text>
