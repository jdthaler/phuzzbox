<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="The Gravitational Lens: two rays from the source bend round the mass to you, the first past the near side, the second past the far side, 1.99 ms later">
